<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Threadwalk — Arrow Path Prototype</title>
<style>
  :root{
    --ink:#12141c;
    --panel:#1b1f2c;
    --cell:#242a3c;
    --cell-border:#343c56;
    --arrow:#5c6690;
    --thread-a:#ffb454;
    --thread-b:#ff6b4a;
    --start:#4ade80;
    --goal:#ff6b4a;
    --text:#e9ebf5;
    --sub:#8890b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding:24px 16px 40px;
    overflow-x:hidden;
  }
  .topbar{
    width:100%;
    max-width:360px;
    display:flex;
    justify-content:flex-end;
  }
  .icon-btn{
    background:var(--panel);
    border:1px solid var(--cell-border);
    color:var(--text);
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .eyebrow{
    letter-spacing:.14em;
    font-size:11px;
    color:var(--thread-a);
    font-weight:700;
    text-transform:uppercase;
    margin-top:6px;
  }
  h1{
    margin:4px 0 2px;
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--sub);
    font-size:13px;
    margin-bottom:16px;
    text-align:center;
    max-width:320px;
  }
  .diffs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .diff-btn{
    background:var(--panel);
    border:1px solid var(--cell-border);
    color:var(--sub);
    font-size:12px;
    font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .diff-btn.active{
    color:var(--ink);
    background:linear-gradient(135deg,var(--thread-a),var(--thread-b));
    border-color:transparent;
  }
  .hud{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .hud-chip{
    background:var(--panel);
    border:1px solid var(--cell-border);
    border-radius:12px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
    min-width:78px;
    justify-content:center;
  }
  .hud-chip .lab{
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--sub);
    font-weight:700;
  }
  .stage{
    position:relative;
    background:var(--panel);
    border-radius:20px;
    padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .grid{
    position:relative;
    display:grid;
    touch-action:none;
    user-select:none;
    gap:4px;
  }
  .cell{
    position:relative;
    background:var(--cell);
    border:1px solid var(--cell-border);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:box-shadow .2s ease;
  }
  .cell.visited{
    background:#2b2440;
    border-color:var(--thread-a);
  }
  .cell.hint-glow{
    box-shadow:0 0 0 3px var(--thread-a), 0 0 16px var(--thread-a);
  }
  .arrow{
    width:38%;
    height:38%;
    border-right:3px solid var(--arrow);
    border-bottom:3px solid var(--arrow);
    transform-origin:center;
  }
  .cell.visited .arrow{ border-color:#ffdca8; opacity:.55; }
  .dir-right .arrow{ transform:rotate(-45deg); }
  .dir-left  .arrow{ transform:rotate(135deg); }
  .dir-down  .arrow{ transform:rotate(45deg); }
  .dir-up    .arrow{ transform:rotate(-135deg); }
  .marker{
    position:absolute;
    width:34%;
    height:34%;
    border-radius:50%;
  }
  .marker.start-dot{ background:var(--start); box-shadow:0 0 10px var(--start); }
  .marker.goal-dot{ background:var(--goal); box-shadow:0 0 10px var(--goal); }
  .thread-svg{
    position:absolute;
    top:0;left:0;
    pointer-events:none;
  }
  .controls{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    background:var(--panel);
    border:1px solid var(--cell-border);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--thread-a),var(--thread-b));
    color:var(--ink);
    border-color:transparent;
  }
  .btn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .progress{
    margin-top:14px;
    font-size:12px;
    color:var(--sub);
    letter-spacing:.04em;
  }
  .best{
    margin-top:4px;
    font-size:11px;
    color:var(--thread-a);
  }
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,11,17,.72);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
    z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background:var(--panel);
    border:1px solid var(--cell-border);
    border-radius:18px;
    padding:26px 30px;
    text-align:center;
    transform:translateY(10px);
    transition:transform .25s ease;
  }
  .overlay.show .win-card{ transform:translateY(0); }
  .win-card h2{ margin:0 0 6px; font-size:22px; }
  .win-card p{ margin:0 0 4px; color:var(--sub); font-size:13px; }
  .win-card .win-time{ color:var(--thread-a); font-weight:800; font-size:15px; margin-bottom:16px; }
</style>
</head>
<body>

  <div class="topbar">
    <button class="icon-btn" id="soundBtn" title="Toggle sound">🔊</button>
  </div>

  <div class="eyebrow">Prototype · Web</div>
  <h1>Threadwalk</h1>
  <p class="sub">Start (green) se drag karke arrows follow karo, goal (coral) tak thread pohanchao.</p>

  <div class="diffs" id="diffs">
    <button class="diff-btn" data-cols="5" data-rows="6">Easy</button>
    <button class="diff-btn active" data-cols="6" data-rows="8">Medium</button>
    <button class="diff-btn" data-cols="7" data-rows="9">Hard</button>
  </div>

  <div class="hud">
    <div class="hud-chip"><span id="timerVal">00:00</span><span class="lab">Time</span></div>
    <div class="hud-chip"><span id="hintVal">3</span><span class="lab">Hints</span></div>
  </div>

  <div class="stage">
    <div class="grid" id="grid"></div>
  </div>

  <div class="progress" id="progress">0 / 0 cells</div>
  <div class="best" id="bestVal"></div>

  <div class="controls">
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn" id="hintBtn">💡 Hint</button>
    <button class="btn primary" id="newBtn">New Puzzle</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <h2>Thread complete ✨</h2>
      <p>Poora path sahi trace hua.</p>
      <div class="win-time" id="winTime"></div>
      <button class="btn primary" id="winNewBtn">Play Again</button>
    </div>
  </div>

<script>
(function(){
  const gridEl = document.getElementById('grid');
  const progressEl = document.getElementById('progress');
  const bestEl = document.getElementById('bestVal');
  const overlay = document.getElementById('overlay');
  const timerValEl = document.getElementById('timerVal');
  const hintValEl = document.getElementById('hintVal');
  const hintBtn = document.getElementById('hintBtn');
  const soundBtn = document.getElementById('soundBtn');
  const winTimeEl = document.getElementById('winTime');
  const CELL = 44, GAP = 4;

  let rows = 8, cols = 6, diffKey = 'medium';
  let path = [];
  let cellEls = [];
  let currentIndex = 0;
  let dragging = false;
  let svg, polyline;

  let timerInterval = null;
  let startTime = null;
  let elapsedMs = 0;
  let finished = false;

  let hintsLeft = 3;
  const HINTS_PER_PUZZLE = 3;

  let muted = false;
  let audioCtx = null;

  // ---------- audio ----------
  function getCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, duration, type, vol){
    if(muted) return;
    try{
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.14;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    }catch(e){}
  }
  function soundStep(idx){ playTone(420 + idx*6, 0.07, 'sine', 0.12); }
  function soundBack(){ playTone(260, 0.08, 'sine', 0.1); }
  function soundHint(){ playTone(660, 0.12, 'triangle', 0.12); }
  function soundClick(){ playTone(340, 0.05, 'square', 0.06); }
  function soundWin(){
    [523,659,784,1046].forEach((f,i)=>{
      setTimeout(()=>playTone(f, 0.18, 'sine', 0.14), i*110);
    });
  }

  soundBtn.addEventListener('click', ()=>{
    muted = !muted;
    soundBtn.textContent = muted ? '🔇' : '🔊';
    localStorage.setItem('threadwalk_muted', muted ? '1' : '0');
  });
  if(localStorage.getItem('threadwalk_muted') === '1'){
    muted = true; soundBtn.textContent = '🔇';
  }

  // ---------- timer ----------
  function formatTime(ms){
    const total = Math.floor(ms/1000);
    const m = String(Math.floor(total/60)).padStart(2,'0');
    const s = String(total%60).padStart(2,'0');
    return `${m}:${s}`;
  }
  function startTimer(){
    if(timerInterval) return;
    startTime = Date.now() - elapsedMs;
    timerInterval = setInterval(()=>{
      elapsedMs = Date.now() - startTime;
      timerValEl.textContent = formatTime(elapsedMs);
    }, 250);
  }
  function stopTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
  }
  function resetTimer(){
    stopTimer();
    elapsedMs = 0;
    timerValEl.textContent = '00:00';
  }

  function bestKey(){ return `threadwalk_best_${diffKey}`; }
  function showBest(){
    const v = localStorage.getItem(bestKey());
    bestEl.textContent = v ? `Best: ${formatTime(+v)}` : '';
  }
  function maybeSaveBest(ms){
    const cur = localStorage.getItem(bestKey());
    if(!cur || ms < +cur){
      localStorage.setItem(bestKey(), String(ms));
    }
    showBest();
  }

  // ---------- puzzle generation ----------
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function findHamiltonianPath(rows, cols){
    const total = rows*cols;
    for(let attempt=0; attempt<60; attempt++){
      const visited = Array.from({length:rows},()=>Array(cols).fill(false));
      const p = [];
      const sr = Math.floor(Math.random()*rows);
      const sc = Math.floor(Math.random()*cols);

      function neighborsOf(r,c){
        return shuffle([[r-1,c],[r+1,c],[r,c-1],[r,c+1]])
          .filter(([nr,nc])=>nr>=0&&nr<rows&&nc>=0&&nc<cols&&!visited[nr][nc]);
      }
      function dfs(r,c){
        visited[r][c]=true; p.push([r,c]);
        if(p.length===total) return true;
        const ns = neighborsOf(r,c);
        for(const [nr,nc] of ns){
          if(dfs(nr,nc)) return true;
        }
        visited[r][c]=false; p.pop();
        return false;
      }
      if(dfs(sr,sc)) return p;
    }
    const p=[];
    for(let r=0;r<rows;r++){
      if(r%2===0) for(let c=0;c<cols;c++) p.push([r,c]);
      else for(let c=cols-1;c>=0;c--) p.push([r,c]);
    }
    return p;
  }

  function dirBetween(a,b){
    if(b[0]===a[0]-1) return 'up';
    if(b[0]===a[0]+1) return 'down';
    if(b[1]===a[1]-1) return 'left';
    return 'right';
  }

  function buildGrid(){
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = `repeat(${cols}, ${CELL}px)`;
    gridEl.style.gridTemplateRows = `repeat(${rows}, ${CELL}px)`;
    gridEl.style.width = `${cols*CELL + (cols-1)*GAP}px`;
    gridEl.style.height = `${rows*CELL + (rows-1)*GAP}px`;

    cellEls = [];
    path = findHamiltonianPath(rows, cols);

    for(let i=0;i<path.length;i++){
      const [r,c] = path[i];
      const div = document.createElement('div');
      div.className = 'cell';
      div.dataset.r = r; div.dataset.c = c; div.dataset.idx = i;

      if(i < path.length-1){
        const dir = dirBetween(path[i], path[i+1]);
        const arrow = document.createElement('div');
        arrow.className = `arrow dir-${dir}`;
        div.appendChild(arrow);
      }
      if(i===0){
        const m = document.createElement('div');
        m.className = 'marker start-dot';
        div.appendChild(m);
      }
      if(i===path.length-1){
        const m = document.createElement('div');
        m.className = 'marker goal-dot';
        div.appendChild(m);
      }
      gridEl.appendChild(div);
      cellEls[r*cols + c] = div;
    }

    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','thread-svg');
    svg.setAttribute('width', gridEl.style.width.replace('px',''));
    svg.setAttribute('height', gridEl.style.height.replace('px',''));
    polyline = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    polyline.setAttribute('fill','none');
    polyline.setAttribute('stroke','url(#threadGrad)');
    polyline.setAttribute('stroke-width','6');
    polyline.setAttribute('stroke-linecap','round');
    polyline.setAttribute('stroke-linejoin','round');

    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    const grad = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
    grad.setAttribute('id','threadGrad');
    grad.setAttribute('x1','0%'); grad.setAttribute('y1','0%');
    grad.setAttribute('x2','100%'); grad.setAttribute('y2','100%');
    const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
    s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#ffb454');
    const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
    s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#ff6b4a');
    grad.appendChild(s1); grad.appendChild(s2);
    defs.appendChild(grad);
    svg.appendChild(defs);
    svg.appendChild(polyline);
    gridEl.appendChild(svg);

    currentIndex = 0;
    finished = false;
    hintsLeft = HINTS_PER_PUZZLE;
    hintValEl.textContent = hintsLeft;
    hintBtn.disabled = false;
    resetTimer();
    showBest();
    updateVisited();
    updateProgress();
  }

  function centerOf(idx){
    const [r,c] = path[idx];
    return [ c*(CELL+GAP) + CELL/2, r*(CELL+GAP) + CELL/2 ];
  }

  function updateVisited(){
    cellEls.forEach(el => el && el.classList.remove('visited'));
    const pts = [];
    for(let i=0;i<=currentIndex;i++){
      const [r,c] = path[i];
      cellEls[r*cols+c].classList.add('visited');
      pts.push(centerOf(i).join(','));
    }
    polyline.setAttribute('points', pts.join(' '));
  }

  function updateProgress(){
    progressEl.textContent = `${currentIndex+1} / ${path.length} cells`;
  }

  function cellFromPoint(x,y){
    const el = document.elementFromPoint(x,y);
    if(!el) return null;
    const cellDiv = el.closest('.cell');
    if(!cellDiv || !gridEl.contains(cellDiv)) return null;
    return cellDiv;
  }
  function idxOfCellDiv(div){
    const r = +div.dataset.r, c = +div.dataset.c;
    return path.findIndex(([pr,pc]) => pr===r && pc===c);
  }

  gridEl.addEventListener('pointerdown', (e)=>{
    if(finished) return;
    const div = cellFromPoint(e.clientX, e.clientY);
    if(!div) return;
    const idx = idxOfCellDiv(div);
    if(idx !== 0) return;
    dragging = true;
    currentIndex = 0;
    updateVisited(); updateProgress();
    startTimer();
    gridEl.setPointerCapture(e.pointerId);
  });

  gridEl.addEventListener('pointermove', (e)=>{
    if(!dragging || finished) return;
    const div = cellFromPoint(e.clientX, e.clientY);
    if(!div) return;
    const idx = idxOfCellDiv(div);
    if(idx === -1) return;
    if(idx === currentIndex+1){
      currentIndex = idx;
      updateVisited(); updateProgress();
      soundStep(currentIndex);
      if(currentIndex === path.length-1){
        dragging = false;
        finished = true;
        stopTimer();
        soundWin();
        winTimeEl.textContent = `Time: ${formatTime(elapsedMs)}`;
        maybeSaveBest(elapsedMs);
        setTimeout(()=> overlay.classList.add('show'), 200);
      }
    } else if(idx === currentIndex-1){
      currentIndex = idx;
      updateVisited(); updateProgress();
      soundBack();
    }
  });

  function endDrag(){ dragging = false; }
  gridEl.addEventListener('pointerup', endDrag);
  gridEl.addEventListener('pointercancel', endDrag);

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    soundClick();
    currentIndex = 0;
    finished = false;
    updateVisited(); updateProgress();
    overlay.classList.remove('show');
    resetTimer();
  });

  hintBtn.addEventListener('click', ()=>{
    if(finished || hintsLeft <= 0 || currentIndex >= path.length-1) return;
    const [nr,nc] = path[currentIndex+1];
    const el = cellEls[nr*cols+nc];
    el.classList.add('hint-glow');
    soundHint();
    setTimeout(()=> el.classList.remove('hint-glow'), 800);
    hintsLeft--;
    hintValEl.textContent = hintsLeft;
    if(hintsLeft<=0) hintBtn.disabled = true;
  });

  document.getElementById('newBtn').addEventListener('click', ()=>{
    soundClick();
    overlay.classList.remove('show');
    buildGrid();
  });
  document.getElementById('winNewBtn').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    buildGrid();
  });

  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      soundClick();
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      cols = +btn.dataset.cols;
      rows = +btn.dataset.rows;
      diffKey = btn.textContent.trim().toLowerCase();
      overlay.classList.remove('show');
      buildGrid();
    });
  });

  buildGrid();
})();
</script>
</body>
</html>
