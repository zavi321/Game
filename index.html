<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Threadwalk — Arrow Path Prototype</title>
<style>
  :root{
    --ink:#12141c;
    --panel:#1b1f2c;
    --cell:#242a3c;
    --cell-border:#343c56;
    --arrow:#5c6690;
    --thread-a:#ffb454;
    --thread-b:#ff6b4a;
    --start:#4ade80;
    --goal:#ff6b4a;
    --text:#e9ebf5;
    --sub:#8890b0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding:28px 16px 40px;
    overflow-x:hidden;
  }
  .eyebrow{
    letter-spacing:.14em;
    font-size:11px;
    color:var(--thread-a);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    margin:4px 0 2px;
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--sub);
    font-size:13px;
    margin-bottom:20px;
    text-align:center;
    max-width:320px;
  }
  .diffs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .diff-btn{
    background:var(--panel);
    border:1px solid var(--cell-border);
    color:var(--sub);
    font-size:12px;
    font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .diff-btn.active{
    color:var(--ink);
    background:linear-gradient(135deg,var(--thread-a),var(--thread-b));
    border-color:transparent;
  }
  .stage{
    position:relative;
    background:var(--panel);
    border-radius:20px;
    padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .grid{
    position:relative;
    display:grid;
    touch-action:none;
    user-select:none;
    gap:4px;
  }
  .cell{
    position:relative;
    background:var(--cell);
    border:1px solid var(--cell-border);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cell.visited{
    background:#2b2440;
    border-color:var(--thread-a);
  }
  .cell.start{ }
  .arrow{
    width:38%;
    height:38%;
    border-right:3px solid var(--arrow);
    border-bottom:3px solid var(--arrow);
    transform-origin:center;
  }
  .cell.visited .arrow{ border-color:#ffdca8; opacity:.55; }
  .dir-right .arrow{ transform:rotate(-45deg); }
  .dir-left  .arrow{ transform:rotate(135deg); }
  .dir-down  .arrow{ transform:rotate(45deg); }
  .dir-up    .arrow{ transform:rotate(-135deg); }
  .marker{
    position:absolute;
    width:34%;
    height:34%;
    border-radius:50%;
  }
  .marker.start-dot{ background:var(--start); box-shadow:0 0 10px var(--start); }
  .marker.goal-dot{ background:var(--goal); box-shadow:0 0 10px var(--goal); }
  .thread-svg{
    position:absolute;
    top:0;left:0;
    pointer-events:none;
  }
  .controls{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    background:var(--panel);
    border:1px solid var(--cell-border);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--thread-a),var(--thread-b));
    color:var(--ink);
    border-color:transparent;
  }
  .progress{
    margin-top:14px;
    font-size:12px;
    color:var(--sub);
    letter-spacing:.04em;
  }
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,11,17,.72);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
    z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background:var(--panel);
    border:1px solid var(--cell-border);
    border-radius:18px;
    padding:26px 30px;
    text-align:center;
    transform:translateY(10px);
    transition:transform .25s ease;
  }
  .overlay.show .win-card{ transform:translateY(0); }
  .win-card h2{ margin:0 0 6px; font-size:22px; }
  .win-card p{ margin:0 0 16px; color:var(--sub); font-size:13px; }
</style>
</head>
<body>

  <div class="eyebrow">Prototype · Web</div>
  <h1>Threadwalk</h1>
  <p class="sub">Start (green) se drag karke arrows follow karo, goal (coral) tak thread pohanchao.</p>

  <div class="diffs" id="diffs">
    <button class="diff-btn" data-cols="5" data-rows="6">Easy</button>
    <button class="diff-btn active" data-cols="6" data-rows="8">Medium</button>
    <button class="diff-btn" data-cols="7" data-rows="9">Hard</button>
  </div>

  <div class="stage">
    <div class="grid" id="grid"></div>
  </div>

  <div class="progress" id="progress">0 / 0 cells</div>

  <div class="controls">
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn primary" id="newBtn">New Puzzle</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <h2>Thread complete ✨</h2>
      <p>Poora path sahi trace hua.</p>
      <button class="btn primary" id="winNewBtn">Play Again</button>
    </div>
  </div>

<script>
(function(){
  const gridEl = document.getElementById('grid');
  const progressEl = document.getElementById('progress');
  const overlay = document.getElementById('overlay');
  const CELL = 44, GAP = 4;

  let rows = 8, cols = 6;
  let path = [];
  let cellEls = [];
  let currentIndex = 0;
  let dragging = false;
  let svg, polyline;

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function findHamiltonianPath(rows, cols){
    const total = rows*cols;
    for(let attempt=0; attempt<60; attempt++){
      const visited = Array.from({length:rows},()=>Array(cols).fill(false));
      const p = [];
      const sr = Math.floor(Math.random()*rows);
      const sc = Math.floor(Math.random()*cols);

      function neighborsOf(r,c){
        return shuffle([[r-1,c],[r+1,c],[r,c-1],[r,c+1]])
          .filter(([nr,nc])=>nr>=0&&nr<rows&&nc>=0&&nc<cols&&!visited[nr][nc]);
      }

      function dfs(r,c,depth){
        visited[r][c]=true; p.push([r,c]);
        if(p.length===total) return true;
        const ns = neighborsOf(r,c);
        for(const [nr,nc] of ns){
          if(dfs(nr,nc,depth+1)) return true;
        }
        visited[r][c]=false; p.pop();
        return false;
      }

      if(dfs(sr,sc,0)) return p;
    }
    // fallback: boustrophedon snake, always valid
    const p=[];
    for(let r=0;r<rows;r++){
      if(r%2===0) for(let c=0;c<cols;c++) p.push([r,c]);
      else for(let c=cols-1;c>=0;c--) p.push([r,c]);
    }
    return p;
  }

  function dirBetween(a,b){
    if(b[0]===a[0]-1) return 'up';
    if(b[0]===a[0]+1) return 'down';
    if(b[1]===a[1]-1) return 'left';
    return 'right';
  }

  function buildGrid(){
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = `repeat(${cols}, ${CELL}px)`;
    gridEl.style.gridTemplateRows = `repeat(${rows}, ${CELL}px)`;
    gridEl.style.width = `${cols*CELL + (cols-1)*GAP}px`;
    gridEl.style.height = `${rows*CELL + (rows-1)*GAP}px`;

    cellEls = [];
    path = findHamiltonianPath(rows, cols);

    for(let i=0;i<path.length;i++){
      const [r,c] = path[i];
      const div = document.createElement('div');
      div.className = 'cell';
      div.dataset.r = r; div.dataset.c = c; div.dataset.idx = i;

      if(i < path.length-1){
        const dir = dirBetween(path[i], path[i+1]);
        const arrow = document.createElement('div');
        arrow.className = `arrow dir-${dir}`;
        div.appendChild(arrow);
      }
      if(i===0){
        const m = document.createElement('div');
        m.className = 'marker start-dot';
        div.appendChild(m);
      }
      if(i===path.length-1){
        const m = document.createElement('div');
        m.className = 'marker goal-dot';
        div.appendChild(m);
      }
      gridEl.appendChild(div);
      cellEls[r*cols + c] = div;
    }

    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','thread-svg');
    svg.setAttribute('width', gridEl.style.width.replace('px',''));
    svg.setAttribute('height', gridEl.style.height.replace('px',''));
    polyline = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    polyline.setAttribute('fill','none');
    polyline.setAttribute('stroke','url(#threadGrad)');
    polyline.setAttribute('stroke-width','6');
    polyline.setAttribute('stroke-linecap','round');
    polyline.setAttribute('stroke-linejoin','round');

    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    const grad = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
    grad.setAttribute('id','threadGrad');
    grad.setAttribute('x1','0%'); grad.setAttribute('y1','0%');
    grad.setAttribute('x2','100%'); grad.setAttribute('y2','100%');
    const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
    s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#ffb454');
    const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
    s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#ff6b4a');
    grad.appendChild(s1); grad.appendChild(s2);
    defs.appendChild(grad);
    svg.appendChild(defs);
    svg.appendChild(polyline);
    gridEl.appendChild(svg);

    currentIndex = 0;
    updateVisited();
    updateProgress();
  }

  function centerOf(idx){
    const [r,c] = path[idx];
    return [ c*(CELL+GAP) + CELL/2, r*(CELL+GAP) + CELL/2 ];
  }

  function updateVisited(){
    cellEls.forEach(el => el && el.classList.remove('visited'));
    const pts = [];
    for(let i=0;i<=currentIndex;i++){
      const [r,c] = path[i];
      cellEls[r*cols+c].classList.add('visited');
      pts.push(centerOf(i).join(','));
    }
    polyline.setAttribute('points', pts.join(' '));
  }

  function updateProgress(){
    progressEl.textContent = `${currentIndex+1} / ${path.length} cells`;
  }

  function cellFromPoint(x,y){
    const el = document.elementFromPoint(x,y);
    if(!el) return null;
    const cellDiv = el.closest('.cell');
    if(!cellDiv || !gridEl.contains(cellDiv)) return null;
    return cellDiv;
  }

  function idxOfCellDiv(div){
    const r = +div.dataset.r, c = +div.dataset.c;
    return path.findIndex(([pr,pc]) => pr===r && pc===c);
  }

  gridEl.addEventListener('pointerdown', (e)=>{
    const div = cellFromPoint(e.clientX, e.clientY);
    if(!div) return;
    const idx = idxOfCellDiv(div);
    if(idx !== 0) return;
    dragging = true;
    currentIndex = 0;
    updateVisited(); updateProgress();
    gridEl.setPointerCapture(e.pointerId);
  });

  gridEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const div = cellFromPoint(e.clientX, e.clientY);
    if(!div) return;
    const idx = idxOfCellDiv(div);
    if(idx === -1) return;
    if(idx === currentIndex+1){
      currentIndex = idx;
      updateVisited(); updateProgress();
      if(currentIndex === path.length-1){
        dragging = false;
        setTimeout(()=> overlay.classList.add('show'), 200);
      }
    } else if(idx === currentIndex-1){
      currentIndex = idx;
      updateVisited(); updateProgress();
    }
  });

  function endDrag(e){
    dragging = false;
  }
  gridEl.addEventListener('pointerup', endDrag);
  gridEl.addEventListener('pointercancel', endDrag);

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    currentIndex = 0;
    updateVisited(); updateProgress();
    overlay.classList.remove('show');
  });
  document.getElementById('newBtn').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    buildGrid();
  });
  document.getElementById('winNewBtn').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    buildGrid();
  });

  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      cols = +btn.dataset.cols;
      rows = +btn.dataset.rows;
      overlay.classList.remove('show');
      buildGrid();
    });
  });

  buildGrid();
})();
</script>
</body>
</html>
